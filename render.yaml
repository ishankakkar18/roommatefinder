# Render blueprint — free web service running the API container.
# Deploy: Render -> New -> Blueprint -> pick this repo.
#
# The database credentials below point at a TiDB Cloud Serverless cluster
# (MySQL 8.5 compatible) and use a RESTRICTED user that can only touch the
# `flatmate` schema. They are committed so the blueprint can apply them
# without a masked-input round trip — rotate them in TiDB if this repo is
# ever public with real data.
services:
  - type: web
    name: flatmate-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        value: "jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/flatmate?sslMode=REQUIRED&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8"
      - key: DB_USER
        value: "4PtP6jdhdQCCnrD.flatmate_app"
      - key: DB_PASSWORD
        value: "FlatmateApp2026!"
      - key: JWT_SECRET
        generateValue: true
      - key: DB_POOL
        value: "3"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Djava.net.preferIPv4Stack=true"
